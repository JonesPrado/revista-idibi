<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#661414">
  <meta name="description" content="Idibi — rios, território e vida na Amazônia.">
  <title>Idibi — Rios que adoecem</title>
  <link rel="stylesheet" href="styles.css?v=38">
  <script defer src="page-narration.js?v=1"></script>
  <script defer src="figma-reader.js?v=27"></script>
</head>
<body>
  <main id="magazine" aria-label="Revista digital Idibi"></main>

  <aside class="index-drawer" id="index-drawer" hidden aria-label="Índice da edição">
    <div class="drawer-head"><span>Idibi <i>·</i> Edição 01</span><button id="close-index" type="button" aria-label="Fechar índice">×</button></div>
    <a class="drawer-summary" id="drawer-summary" href="#sumario-editorial">Sumário <span>↗</span></a>
    <ol id="drawer-links"></ol>
  </aside>
  <div class="drawer-scrim" id="drawer-scrim" hidden></div>

  <footer class="reader-footer" aria-label="Controles de leitura">
    <div class="reader-footer__main">
      <div class="reader-footer__identity">
        <button class="index-trigger" id="index-trigger" type="button" aria-label="Abrir índice" aria-controls="index-drawer" aria-expanded="false"><span class="menu-icon" aria-hidden="true"><i></i><i></i></span><span class="index-trigger__text">Índice</span></button>
        <span class="reader-location" id="reader-location" aria-live="polite">Capa da edição</span>
      </div>
      <nav class="reader-controls" aria-label="Navegação da revista">
        <button id="previous-page" type="button" aria-label="Página anterior" title="Página anterior">←</button>
        <span class="page-count" id="page-count" role="status">01 <i>/</i> 27</span>
        <button id="next-page" type="button" aria-label="Próxima página" title="Próxima página">→</button>
      </nav>
      <div class="reader-tools" aria-label="Ferramentas de leitura">
        <button id="zoom-out" type="button" aria-label="Diminuir zoom" title="Diminuir zoom">−</button>
        <button id="zoom-reset" type="button" aria-label="Ajustar à tela" title="Ajustar à tela">100%</button>
        <button id="zoom-in" type="button" aria-label="Aumentar zoom" title="Aumentar zoom">+</button>
        <button id="voice-toggle" type="button" aria-label="Ouvir página" aria-pressed="false" title="Ouvir página">🔊</button>
        <button id="reader-fullscreen" type="button" aria-label="Entrar em tela cheia" title="Tela cheia">⛶</button>
      </div>
    </div>
    <div class="reader-footer__progress"><span>01</span><input id="page-range" type="range" min="0" max="26" value="0" step="1" aria-label="Escolher página da revista"><span>27</span></div>
  </footer>

  <dialog class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightbox-close" type="button" aria-label="Fechar imagem">×</button>
    <button class="lightbox-step lightbox-previous" id="lightbox-previous" type="button" aria-label="Imagem anterior">←</button>
    <img id="lightbox-image" alt="">
    <button class="lightbox-step lightbox-next" id="lightbox-next" type="button" aria-label="Próxima imagem">→</button>
    <p id="lightbox-caption"></p>
    <span class="lightbox-count" id="lightbox-count" aria-live="polite"></span>
  </dialog>
</body>
</html>
